services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pastejo}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postdba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dw3backend/databaseConfig.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pastejo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./dw3backend
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:-pastejo}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postdba}
      DB_HOST: database
      DB_PORT: 5432
      SECRET_API: ${SECRET_API:-chave-secreta}
    ports:
      - "40000:40000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:40000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./dw3frontend
    restart: unless-stopped
    environment:
      PORT: 40100
      SERVIDOR_DW3: ${SERVIDOR_DW3:-http://localhost:40000}
    ports:
      - "40100:40100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:40100/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
